name: CI

# The port targets Windows first. Type checking the Rust half does work from
# macOS (`cargo check --target x86_64-pc-windows-gnu`, with mingw-w64), but
# *packaging* cannot: PyInstaller builds only for the interpreter it runs under,
# and there is no MSVC linker here. So the Windows runner is the only place a
# Windows build is produced and verified before it reaches a real machine.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mp3-metadata-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the engine and its test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . 
          pip install pytest httpx pyinstaller
      - name: Run the engine test suite
        run: python -m pytest -q

  frontend:
    name: Frontend (types, lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mp3-desktop-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: mp3-desktop-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec tsc -b
      - name: Lint
        run: pnpm run lint
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm run build

  shell:
    name: Rust shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A cold Windows build of the Tauri dependency tree is slow (tens of
    # minutes); it should never be unbounded. Without this a stuck runner holds
    # the job — and the queue — open indefinitely, which has happened once.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: mp3-desktop-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mp3-desktop-frontend/src-tauri
      - name: Install Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      # tauri-build refuses to compile until the externalBin file exists, so a
      # fresh checkout needs a stub. The real engine is not needed to build or
      # test the Rust half.
      - name: Stub the sidecar
        run: node scripts/placeholder-sidecar.mjs
      # NOTE (Windows): a debug build of the Tauri dependency tree takes longer
      # than the release build the packaging job does — observed to exceed the
      # job timeout on a cold cache, while `package-windows` (release, warm
      # cache) finished in ~10 minutes. It compiles; it is just slow. If this
      # job keeps timing out, the fix is to carry the cache between jobs rather
      # than to raise the timeout again.
      - name: Build and test the shell
        working-directory: mp3-desktop-frontend/src-tauri
        run: cargo test --verbose

  package-windows:
    name: Package (Windows NSIS installer)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mp3-desktop-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: mp3-desktop-frontend/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mp3-desktop-frontend/src-tauri
      - name: Install the engine's build dependencies
        working-directory: mp3-metadata-api
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
      - run: pnpm install --frozen-lockfile
      - name: Freeze the engine and stage it as a sidecar
        run: node scripts/build-sidecar.mjs
      - name: Show what the sidecar is named
        run: Get-ChildItem src-tauri/binaries
        shell: pwsh
      - name: Build the app and the installer
        run: pnpm exec tauri build
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: yame-windows-installer
          path: |
            mp3-desktop-frontend/src-tauri/target/release/bundle/nsis/*.exe
            mp3-desktop-frontend/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
