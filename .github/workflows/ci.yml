name: CI

# Two tiers, because they answer different questions and cost very different
# amounts of time.
#
#   verify  — "is this change sound?" Runs on every push, on all three
#             platforms, in roughly two minutes: types, lint, tests, and a
#             `cargo check --all-targets` per OS.
#   package — "does a real Windows build come out?" Needs PyInstaller, a full
#             release compile and the bundler, so it is minutes rather than
#             seconds. On demand, or automatically on main.
#
# Packaging on every push is what made testing a two-line change a twenty-minute
# round trip. It is now something you ask for.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'ports/**', 'LICENSE']
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: Also build the Windows portable zip and installer
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ fast tier

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mp3-desktop-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: mp3-desktop-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # One step, so a failure is one place to look.
      - name: Types, lint, unit tests, build
        run: |
          pnpm exec tsc -b
          pnpm run lint
          pnpm test
          pnpm run build

  engine:
    name: Engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mp3-metadata-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest httpx
      - run: python -m pytest -q

  shell-check:
    name: Shell check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: mp3-desktop-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # A key independent of the commit, so the cache survives every push. The
      # default per-ref keys meant a cold dependency build — the largest single
      # cost here — on nearly every commit.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mp3-desktop-frontend/src-tauri
          key: shell
      - name: Install Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      # tauri-build refuses to compile until the externalBin file exists.
      - run: node scripts/placeholder-sidecar.mjs
      # `--all-targets` is the point: it compiles the test code too, which plain
      # `cargo check` skips — and a platform-specific test failing to compile is
      # a real breakage that has reached this pipeline before.
      - name: Type-check the shell, including tests
        working-directory: mp3-desktop-frontend/src-tauri
        run: cargo check --all-targets --locked

  # -------------------------------------------------------------- thorough tier

  shell-test:
    name: Shell tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mp3-desktop-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mp3-desktop-frontend/src-tauri
          key: shell
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - run: node scripts/placeholder-sidecar.mjs
      # Bounded independently of the job: a hanging test once held a runner for
      # 40 minutes and reported nothing about which test it was.
      - name: Run the shell tests
        env:
          CARGO_TEST_CWD: src-tauri
        run: node scripts/cargo-test-timeout.mjs 600

  package:
    name: Windows portable build
    # On demand, or on main where a downloadable artifact is actually wanted.
    # `inputs.package` only exists for a dispatch, so the branch push is the
    # other way in.
    if: (github.event_name == 'workflow_dispatch' && inputs.package) || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mp3-desktop-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: mp3-desktop-frontend/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mp3-desktop-frontend/src-tauri
          # Separate from the check cache so the two never evict each other:
          # this one holds the release profile the bundler needs.
          key: package
      - name: Install the engine's build dependencies
        working-directory: mp3-metadata-api
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
      - run: pnpm install --frozen-lockfile
      - name: Freeze the engine and stage it as a sidecar
        run: node scripts/build-sidecar.mjs
      - name: Build the app and bundle it
        run: pnpm run package
      - name: Assemble the portable zip
        shell: pwsh
        # One file: the engine is embedded and unpacks on first run.
        run: |
          $release = "src-tauri/target/release"
          $portable = "$release/yame-portable"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item "$release/yame.exe" $portable
          Copy-Item "README-portable.txt" $portable -ErrorAction SilentlyContinue
          Compress-Archive -Path "$portable/*" -DestinationPath "$release/YAME-portable-x64.zip" -Force
          Get-ChildItem $portable
      - uses: actions/upload-artifact@v4
        with:
          name: yame-windows-portable
          path: mp3-desktop-frontend/src-tauri/target/release/YAME-portable-x64.zip
          if-no-files-found: error

  # The installer is the slowest artifact to build and the least useful to test
  # with, so it is opt-in: dispatch with `package`, or push to main.
  installer:
    name: Windows installer
    if: (github.event_name == 'workflow_dispatch' && inputs.package) || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mp3-desktop-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: mp3-desktop-frontend/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mp3-desktop-frontend/src-tauri
          key: package
      - name: Install the engine's build dependencies
        working-directory: mp3-metadata-api
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-sidecar.mjs
      - run: pnpm build
      - name: Build the installer
        run: pnpm exec tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: yame-windows-installer
          path: mp3-desktop-frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
