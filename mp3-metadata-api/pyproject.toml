[project]
name = "mp3metaapi"
version = "1.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "mutagen>=1.47.0",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make `app` importable when pytest is run from anywhere in the project.
pythonpath = ["."]
